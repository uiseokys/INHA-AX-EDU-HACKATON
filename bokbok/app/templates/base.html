<!doctype html>
<html lang="ko" class="h-full antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f8f1" />
    <title>{% block title %}{{ SERVICE }} · 학생 마음 돌봄 플랫폼{% endblock %}</title>
    <meta name="description" content="감정 스티커로 하루를 기록하고, AI 친구 {{ BOT }}와 이야기하고, 필요할 때 선생님과 전문기관으로 이어지는 학생 마음 돌봄 플랫폼 (시연용 프로토타입)" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="/static/app.css?v={{ css_version }}" />
    <script src="/static/app.js?v={{ js_version }}" defer></script>
  </head>
  <body class="flex min-h-full flex-col">
    {% block body %}{% endblock %}

    {# 전화 걸기 확인 창 (app.js) #}
    <dialog id="call-dialog" class="m-auto w-72 rounded-3xl bg-white p-0 text-center shadow-2xl backdrop:bg-ink/40 backdrop:backdrop-blur-sm">
      <div class="px-6 pt-6 pb-4">
        <p class="text-xs font-semibold text-ink-soft" data-call-name></p>
        <p class="mt-1 text-3xl font-extrabold tracking-wide text-ink" data-call-number></p>
        <p class="mt-2 text-xs text-ink-soft">이 번호로 전화를 걸까요?</p>
      </div>
      <div class="grid grid-cols-2 border-t border-stone-100 text-sm font-bold">
        <button type="button" data-call-close class="py-3.5 text-ink-soft hover:bg-stone-50">취소</button>
        <a data-call-go href="#" class="border-l border-stone-100 py-3.5 text-leaf-700 hover:bg-leaf-50">통화</a>
      </div>
    </dialog>

    {% if toast %}
    <div data-toast role="status" class="fixed inset-x-0 bottom-24 z-50 mx-auto w-fit max-w-[90vw] animate-pop rounded-full bg-ink px-5 py-3 text-sm font-semibold text-white shadow-xl md:bottom-10">
      {{ toast }}
    </div>
    {% endif %}
  </body>
</html>
