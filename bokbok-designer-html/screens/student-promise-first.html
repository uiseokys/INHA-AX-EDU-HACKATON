      <h1 class="mt-3 text-2xl font-extrabold text-ink">시작하기 전에, 약속 먼저 할게</h1>
      <p class="mt-1 text-sm text-ink-soft">네 기록과 이야기가 누구에게 어떻게 보이는지 알려 줄게. 하나씩 읽고 눌러 줘.</p>

<form method="post" data-preview-action="/student/promise" class="space-y-6" data-scroll-top>
  
  
  <fieldset>
    <legend class="mb-2 flex items-center gap-2 font-bold text-ink"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5 text-leaf-700" aria-hidden="true"><path d="M15 10V9"/><path d="M16.472 15a6 6 0 01-8.943 0"/><path d="M9 10V9"/><circle cx="12" cy="12" r="10"/></svg> 감정을 기록할 때</legend>
    <div class="space-y-2">
      
<label class="flex cursor-pointer items-start gap-3 rounded-2xl border-2 border-transparent bg-stone-50 px-4 py-3 text-sm leading-relaxed text-ink transition hover:bg-leaf-50 has-[:checked]:border-leaf-500 has-[:checked]:bg-leaf-50">
  <input type="checkbox" name="basic" value="1" class="mt-0.5 size-5 shrink-0" style="accent-color: #2f6b3f"  required />
  <span>내가 고른 감정 스티커와 강도, 감정 단어는 담임 선생님이 봐. 문장은 내가 ‘선생님께 보여 주기’를 고른 것만 보여.</span>
</label>

<label class="flex cursor-pointer items-start gap-3 rounded-2xl border-2 border-transparent bg-stone-50 px-4 py-3 text-sm leading-relaxed text-ink transition hover:bg-leaf-50 has-[:checked]:border-leaf-500 has-[:checked]:bg-leaf-50">
  <input type="checkbox" name="basic" value="2" class="mt-0.5 size-5 shrink-0" style="accent-color: #2f6b3f"  required />
  <span>내가 쓴 문장에 위험해 보이는 말이 있으면, 무슨 말인지는 빼고 ‘신호가 있다’는 것만 선생님께 전해져.</span>
</label>

<label class="flex cursor-pointer items-start gap-3 rounded-2xl border-2 border-transparent bg-stone-50 px-4 py-3 text-sm leading-relaxed text-ink transition hover:bg-leaf-50 has-[:checked]:border-leaf-500 has-[:checked]:bg-leaf-50">
  <input type="checkbox" name="basic" value="3" class="mt-0.5 size-5 shrink-0" style="accent-color: #2f6b3f"  required />
  <span>내 기록은 누가 몰래 바꾸지 못하게 원본 그대로 보존돼. 내가 고치거나 화면에서 지워도 원본은 남아.</span>
</label>

    </div>
  </fieldset>
  <fieldset>
    <legend class="mb-2 flex items-center gap-2 font-bold text-ink"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5 text-leaf-700" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/></svg> 복복이와 이야기할 때 <span class="text-xs font-normal text-ink-soft">(고르지 않아도 돼요)</span></legend>
    <div class="space-y-2">
      
<label class="flex cursor-pointer items-start gap-3 rounded-2xl border-2 border-transparent bg-stone-50 px-4 py-3 text-sm leading-relaxed text-ink transition hover:bg-leaf-50 has-[:checked]:border-leaf-500 has-[:checked]:bg-leaf-50">
  <input type="checkbox" name="chat" value="1" class="mt-0.5 size-5 shrink-0" style="accent-color: #2f6b3f"   />
  <span>복복이와 나눈 이야기는 선생님이 볼 수 없어. 날짜별로 남아서 나만 다시 볼 수 있어.</span>
</label>

<label class="flex cursor-pointer items-start gap-3 rounded-2xl border-2 border-transparent bg-stone-50 px-4 py-3 text-sm leading-relaxed text-ink transition hover:bg-leaf-50 has-[:checked]:border-leaf-500 has-[:checked]:bg-leaf-50">
  <input type="checkbox" name="chat" value="2" class="mt-0.5 size-5 shrink-0" style="accent-color: #2f6b3f"   />
  <span>내가 많이 힘들거나 위험해 보이면 ‘신호가 있다’는 것만 선생님께 전해져. 무슨 이야기를 했는지는 전해지지 않고, 그때 나에게 따로 알려 주지도 않아.</span>
</label>

    </div>
    <p class="mt-2 text-xs text-ink-soft">두 가지를 모두 고르면 복복이와 이야기할 수 있어요. 고르지 않아도 감정 기록과 상점은 그대로 쓸 수 있고, 나중에 언제든 바꿀 수 있어요.</p>
  </fieldset>
  
<p class="flex gap-2 rounded-2xl px-4 py-3 text-xs leading-relaxed bg-amber-50 text-amber-900/85 ring-1 ring-amber-100">

  </span>
</p>
